name: Publish Docker image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  docker:
    uses: donuk/github-build-to-dockerhub/.github/workflows/docker-publish.yml@master
    with:
      image_name: donuk/portforwarding
      test_script: |
        export PORT_8080=127.0.0.1:80
        /docker-entrypoint.sh nginx -t
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
